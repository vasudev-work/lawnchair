name: Desi build

on:
  workflow_dispatch:
  push:
    branches:
      - 'desi-dev'

jobs:
  build-desi-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Use the stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: desi-debug-apk
          path: build/outputs/apk/**/*.apk
